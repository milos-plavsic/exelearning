# Serves dist/static with gzip/brotli/zstd content negotiation.
#
# Precompressed .gz/.br/.zst siblings (produced by scripts/precompress-dist.ts
# during the image build) are served as-is via *_static, with zero runtime
# CPU cost. The dynamic *_filter modules (gzip/brotli/zstd "on") are a
# fallback for any compressible response that has no precompressed sibling
# (e.g. files below the precompression size threshold).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_types application/javascript application/json image/svg+xml text/css text/plain text/xml application/xml;
    gzip_min_length 1024;

    brotli on;
    brotli_static on;
    brotli_types application/javascript application/json image/svg+xml text/css text/plain text/xml application/xml;
    brotli_min_length 1024;

    zstd on;
    zstd_static on;
    zstd_types application/javascript application/json image/svg+xml text/css text/plain text/xml application/xml;
    zstd_min_length 1024;

    location = /healthcheck {
        default_type text/plain;
        return 200 'OK';
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
