# Enables gzip for the default server block in /etc/nginx/conf.d/default.conf
# (nginx:alpine's stock config, otherwise served uncompressed).
#
# gzip_static serves precompressed .gz siblings (produced by
# scripts/precompress-dist.ts during the image build) as-is, with zero
# runtime CPU cost. Dynamic "gzip on" is a fallback for any compressible
# response with no precompressed sibling (e.g. files below the
# precompression size threshold).
gzip on;
gzip_static on;
gzip_vary on;
gzip_types application/javascript application/json image/svg+xml text/css text/plain text/xml application/xml;
gzip_min_length 1024;
